# Coach Trail. Variables lues dans deploy/.env (copie de ../.env.example).
services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-ovh-eu}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:?OVH_APPLICATION_KEY manquant}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:?OVH_APPLICATION_SECRET manquant}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:?OVH_CONSUMER_KEY manquant}
    ports:
      # Uniquement l'IP Tailscale de l'hôte, jamais 0.0.0.0.
      - "${TAILSCALE_IP:?TAILSCALE_IP manquant}:80:80"
      - "${TAILSCALE_IP}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - mcp
      - web

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      DATABASE_PATH: /data/coach.db
      BACKUP_DIR: /backup
      BACKUP_TIME: ${BACKUP_TIME:-04:30}
      GARMIN_TOKEN_DIR: /data/garmin_tokens
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-}
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
    volumes:
      - ../data:/data
      # Disque physiquement distinct de ../data (voir README, « Sauvegardes »).
      - ${BACKUP_HOST_DIR:?BACKUP_HOST_DIR manquant}:/backup
    expose:
      - "8000"

  # Serveur MCP en lecture seule (phase 3) : n'appelle que des GET de l'API. Jeton optionnel.
  mcp:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      MCP_API_URL: http://api:8000
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,${DOMAIN}:*}
    expose:
      - "8765"
    depends_on:
      - api

  web:
    build: ../frontend
    restart: unless-stopped
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
