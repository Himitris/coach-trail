# Coach Trail — socle (phase 0). Variables lues dans deploy/.env (copie de ../.env.example).
services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-ovh-eu}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:?OVH_APPLICATION_KEY manquant}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:?OVH_APPLICATION_SECRET manquant}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:?OVH_CONSUMER_KEY manquant}
    ports:
      # Uniquement l'IP Tailscale de l'hôte, jamais 0.0.0.0.
      - "${TAILSCALE_IP:?TAILSCALE_IP manquant}:80:80"
      - "${TAILSCALE_IP}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ./api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ../data:/data
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
