[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-trail"
version = "0.1.0"
description = "Coach Trail — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "garminconnect==0.3.20",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyyaml>=6",
    "jsonschema>=4",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"app/mcp_server.py" = ["E501"]  # les docstrings sont les descriptions des outils MCP
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "yaml", "jsonschema"]
ignore_missing_imports = true
